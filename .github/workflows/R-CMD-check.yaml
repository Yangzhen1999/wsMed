# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Also check old R, optional dependencies, and execute all tutorials once'
        type: boolean
        default: false

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) ${{ matrix.config.special }}

    strategy:
      fail-fast: false
      matrix:
        # Routine checks cover three operating systems and R-devel.
        # Release preparation adds compatibility checks without duplicating jobs.
        config: >-
          ${{ fromJSON(inputs.full_validation == true &&
          '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"},{"os":"ubuntu-latest","r":"release","nosuggests":true,"special":"No Suggests"}]' ||
          '[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"}]') }}

    env:
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.nosuggests == true && 'true' || 'false' }}
      _R_CHECK_DEPENDS_ONLY_VIGNETTES_: 'false'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::XML
          needs: check

      - name: Verify committed tutorial freshness
        shell: Rscript {0}
        run: |
          source("tools/vignette-build-utils.R")
          check_frozen_vignettes(getwd())

      - name: Verify prebuilt tutorials without rebuilding vignettes
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && matrix.config.nosuggests != true
        shell: Rscript {0}
        run: |
          source("tools/vignette-build-utils.R")
          lib <- file.path(Sys.getenv("RUNNER_TEMP"), "wsmed-prebuilt-library")
          dir.create(lib)
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", "-l", shQuote(lib), "."))
          stopifnot(status == 0L)
          check_installed_vignettes(getwd(), lib)

      - name: Re-execute tutorials once for full validation
        if: inputs.full_validation == true && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && matrix.config.nosuggests != true
        shell: Rscript {0}
        run: |
          source("rebuild_vignettes.R")
          rebuild_vignettes()

      - name: Record tutorial inputs for source-archive verification
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && matrix.config.nosuggests != true
        shell: Rscript {0}
        run: |
          source("tools/vignette-build-utils.R")
          expected <- check_frozen_vignettes(getwd())
          saveRDS(expected, file.path(Sys.getenv("RUNNER_TEMP"), "wsmed-tutorial-inputs.rds"))

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Require completed package checks
        if: always()
        shell: Rscript {0}
        run: |
          source(".github/check-completion.R")
          check_completion("check")

      - name: Verify tutorials in the checked source-archive installation
        if: success() && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && matrix.config.nosuggests != true
        shell: Rscript {0}
        run: |
          source("tools/vignette-build-utils.R")
          expected <- readRDS(file.path(Sys.getenv("RUNNER_TEMP"), "wsmed-tutorial-inputs.rds"))
          check_installed_vignettes(getwd(), file.path("check", "wsMed.Rcheck"), expected)
