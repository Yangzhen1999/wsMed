name: Monte Carlo reproducibility
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sampler:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        r: [release, devel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Check sampler against shared numerical reference
        run: Rscript tools/check-mc-reproducibility.R

  simulation-evidence:
    name: Simulation evidence and analysis pipelines
    env:
      NOT_CRAN: 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::smcfcs, local::.
      - name: Validate simulation design and analysis pipeline
        run: |
          python .github/validation/check-study.py
          Rscript .github/validation/check-simulation.R
          Rscript .github/validation/mi-comparison/check.R
          python .github/validation/mi-comparison/check-evidence.py
