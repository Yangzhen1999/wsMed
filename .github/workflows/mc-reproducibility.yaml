name: Monte Carlo reproducibility
on:
  workflow_dispatch:
  push:
    branches: [fix/mc-reproducibility, feature/modular-api]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'tools/check-mc-reproducibility.R'
      - '.github/workflows/mc-reproducibility.yaml'
  pull_request:
    branches: [master, main]
    paths:
      - 'R/RandomGaussian*'
      - 'tools/check-mc-reproducibility.R'
      - '.github/workflows/mc-reproducibility.yaml'

permissions:
  contents: read

jobs:
  sampler:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        r: [release, devel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Check sampler against shared numerical reference
        run: Rscript tools/check-mc-reproducibility.R

  package-tests:
    name: Package tests (${{ matrix.os }}, R-release)
    env:
      NOT_CRAN: 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
      - name: Run package regression tests
        shell: Rscript {0}
        run: testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)
