# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'man/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'NEWS.md'
      - 'README.md'
      - 'vignettes/**'
      - 'inst/**'
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - 'tools/vignette-build-utils.R'
      - 'rebuild_vignettes.R'
      - '.github/workflows/pkgdown.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'man/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'NEWS.md'
      - 'README.md'
      - 'vignettes/**'
      - 'inst/**'
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - 'tools/vignette-build-utils.R'
      - 'rebuild_vignettes.R'
      - '.github/workflows/pkgdown.yaml'
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event.pull_request.number || 'deployment' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Verify committed tutorials before building the site
        run: |
          source("tools/vignette-build-utils.R")
          check_frozen_vignettes(getwd())
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
