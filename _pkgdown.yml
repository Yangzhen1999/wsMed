url: https://yangzhen1999.github.io/wsMed

template:
  bootstrap: 5
  bootswatch: flatly

assets:
  - inst/extdata

navbar:
  structure:
    left: [start, analysis, results, reference, articles]
    right: [search, github]
  components:
    start:
      text: Get started
      href: articles/GetStarted.html
    analysis:
      text: Analysis guides
      href: articles/AnalysisGuide.html
    results:
      text: Results & plots
      menu:
        - text: Read and export results
          href: articles/ResultsGuide.html
        - text: Plot gallery
          href: articles/PlottingEffects.html
        - text: Standardized effects
          href: articles/StandardizedModeratedMediation.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      href: articles/index.html
    github:
      icon: fab fa-github
      href: https://github.com/Yangzhen1999/wsMed
      aria-label: GitHub Repository

articles:
  - title: Start here
    contents: [GetStarted, AnalysisGuide]
  - title: Read and present results
    contents: [ResultsGuide, PlottingEffects, StandardizedModeratedMediation]
  - title: Analysis options
    contents: [WsMed, CategoricalPredictors, GenerateModelCustom]
  - title: Advanced workflows and reliability
    contents: [ModularWorkflow, WorkflowReliability, CompatibleImputation]
  - title: Model equations and software comparison
    contents: [GenerateModelP, GenerateModelCN, GenerateModelCP, GenerateModelPC, printGM, MEMORE_vs_wsMed]

reference:
  - title: "Main functions"
    desc: "Core functions for within-subject mediation analysis"
    contents:
      - wsMed
  - title: "Staged workflow"
    desc: "Specify, fit, infer, and extract without repeating earlier stages"
    contents:
      - wsmed_model
      - wsmed_fit
      - wsmed_infer
      - wsmed_inspect
      - wsmed_reproducibility
  - title: "Reports, summaries, and effect comparisons"
    desc: "Use [print() and summary()](wsmed_methods.html) to read reports and extract structured tables, and [plot()](wsmed_plots.html) to visualize results. The functions below support focused effect queries and comparisons."
    contents:
      - wsmed_effects
      - wsmed_contrasts
  - title: "Model generation"
    desc: "Functions for generating SEM syntax for different mediation structures"
    contents:
      - printGM
      - GenerateModelP
      - GenerateModelCN
      - GenerateModelCP
      - GenerateModelPC
      - GenerateModelCustom
  - title: "Missing data and imputation"
    desc: "Functions to handle missing data with multiple imputation"
    contents:
      - ImputeData
      - PrepareMissingData
      - MCMI2
      - PrepareData
  - title: "Standardization and conditional effects"
    desc: "Standardize conditional results and visualize effect curves"
    contents:
      - standardize_moderation
      - plot_moderation_curve
      - plot_effects
      - plot_conditional_effects
      - plot_contrasts
  - title: "Data and variable types"
    desc: "Packaged datasets and supported categorical predictors"
    contents:
      - wsmed_examples
      - example_data
      - wsmed_categorical

  - title: internal
    contents:
      - wsmed_methods
      - wsmed_plots
