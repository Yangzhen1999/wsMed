url: https://yangzhen1999.github.io/wsMed


template:
  bootstrap: 5
  bootswatch: flatly

assets:
  - inst/extdata

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [github]
  components:
    home:
      text: "Home"
      href: index.html
    reference:
      text: "Functions"
      href: reference/index.html
    articles:
      text: "Tutorials"
      menu:
        - text: "One-call and staged workflows"
          href: articles/ModularWorkflow.html
        - text: "Diagnostics, reproducibility, and migration"
          href: articles/WorkflowReliability.html
        - text: "Using wsMed step by step"
          href: articles/WsMed.html
        - text: "Plotting mediation effects and contrasts"
          href: articles/PlottingEffects.html
        - text: "Standardized moderated mediation"
          href: articles/StandardizedModeratedMediation.html
        - text: "Model-compatible multiple imputation"
          href: articles/CompatibleImputation.html
        - text: "Inspecting generated SEM syntax"
          href: articles/printGM.html
        - text: "Specifying parallel mediation models"
          href: articles/GenerateModelP.html
        - text: "Specifying serial mediation models"
          href: articles/GenerateModelCN.html
        - text: "Specifying serial-parallel mediation models"
          href: articles/GenerateModelCP.html
        - text: "Specifying parallel-serial mediation models"
          href: articles/GenerateModelPC.html
        - text: "Comparing wsMed and MEMORE"
          href: articles/MEMORE_vs_wsMed.html
        - text: "Specifying user-defined mediation models"
          href: articles/GenerateModelCustom.html
        - text: "Working with categorical predictors"
          href: articles/CategoricalPredictors.html
    news:
      text: "Changelog"
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/Yangzhen1999/wsMed
      aria-label: "GitHub Repository"

reference:
  - title: "Main functions"
    desc: "Core functions for within-subject mediation analysis"
    contents:
      - wsMed
      - printGM
  - title: "Staged workflow"
    desc: "Specify, fit, infer, and extract without repeating earlier stages"
    contents:
      - wsmed_model
      - wsmed_fit
      - wsmed_infer
      - wsmed_inspect
      - wsmed_reproducibility
  - title: "Reports, summaries, and effect comparisons"
    desc: "Use [print() and summary()](wsmed_methods.html) to read reports and extract structured tables, and [plot()](wsmed_plots.html) to visualize results. The functions below support focused effect queries and comparisons."
    contents:
      - wsmed_effects
      - wsmed_contrasts
  - title: "Model generation"
    desc: "Functions for generating SEM syntax for different mediation structures"
    contents:
      - GenerateModelP
      - GenerateModelCN
      - GenerateModelCP
      - GenerateModelPC
      - GenerateModelCustom
  - title: "Missing data and imputation"
    desc: "Functions to handle missing data with multiple imputation"
    contents:
      - ImputeData
      - PrepareMissingData
      - MCMI2
      - PrepareData
  - title: "Standardization and conditional effects"
    desc: "Standardize conditional results and visualize effect curves"
    contents:
      - standardize_moderation
      - plot_moderation_curve
      - plot_effects
      - plot_conditional_effects
      - plot_contrasts
  - title: "Data and variable types"
    desc: "Packaged datasets and supported categorical predictors"
    contents:
      - wsmed_examples
      - example_data
      - wsmed_categorical

  - title: internal
    contents:
      - wsmed_methods
      - wsmed_plots
